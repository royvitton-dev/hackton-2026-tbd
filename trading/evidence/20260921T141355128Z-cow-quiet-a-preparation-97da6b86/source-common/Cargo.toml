[package]
name = "leave-exchange"
version = "0.1.0"
edition = "2024"

[lib]
name = "leave_exchange"
path = "src/lib.rs"

[[bin]]
name = "leave-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout"] }
futures-util = "0.3"
crossbeam-channel = "0.5"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
